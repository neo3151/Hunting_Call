name: OUTCALL CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Java required for Android builds
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Install Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Restore google-services.json from GitHub Secret
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json

      # Resolve dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Statically analyze the Dart code for any syntax or logic errors
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos

      # Run tests — TFLite and platform-specific tests are skipped on CI via
      # their own skip: annotations, so we use --no-test-assets to avoid
      # asset-load failures and continue-on-error is intentional: failing tests
      # are reported but we don't gate the release on CI-environment limitations
      # (TFLite cannot load native libraries on the ubuntu-latest runner).
      - name: Run Tests
        run: flutter test
        continue-on-error: false

